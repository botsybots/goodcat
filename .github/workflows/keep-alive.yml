name: Keep backend awake

# Render's free tier spins the server down after ~15 minutes idle, which
# would also stop it from noticing due reminders while nobody has the app
# open. Pinging the health endpoint every 10 minutes keeps it awake.
# Set the RENDER_APP_URL repo variable (Settings -> Secrets and variables ->
# Actions -> Variables) to the deployed Render URL, e.g.
# https://goodcat-api.onrender.com

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.RENDER_APP_URL }}" ]; then
            echo "RENDER_APP_URL repo variable is not set yet -- skipping."
            exit 0
          fi
          curl -sf "${{ vars.RENDER_APP_URL }}/api/health" || echo "Ping failed (server may be waking up) -- not treating as a failure."
