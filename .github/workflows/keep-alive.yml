name: Keep backend awake

# Render's free tier spins the server down after ~15 minutes idle, which
# would also stop it from noticing due reminders while nobody has the app
# open. Pinging the health endpoint every 10 minutes keeps it awake.
# Set the RENDER_APP_URL repo variable (Settings -> Secrets and variables ->
# Actions -> Variables) to the deployed Render URL, e.g.
# https://goodcat-api.onrender.com
#
# The offset minutes below (7/17/27/37/47/57, not */10) are deliberate --
# GitHub documents that scheduled workflows queued for the top of the hour
# and other round numbers get delayed under high load, since every repo's
# */10 cron fires at the same instant. Confirmed against this repo's own
# run history: on */10, actual runs landed 2-5 hours apart instead of every
# 10 minutes, long enough for Render to fall fully asleep between pings
# (a 26s cold-start round trip, vs sub-second when actually warm) and for
# the server-side reminder/end-of-day/weekly-gap checks -- which only run
# while the process is awake -- to go quiet for hours at a time.

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ vars.RENDER_APP_URL }}" ]; then
            echo "RENDER_APP_URL repo variable is not set yet -- skipping."
            exit 0
          fi
          curl -sf "${{ vars.RENDER_APP_URL }}/api/health" || echo "Ping failed (server may be waking up) -- not treating as a failure."
